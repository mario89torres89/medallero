<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Innova Schools | Neo-Archipelago</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body class="modo-ver">
    <div id="loading-screen">
        <div class="loader-content">
            <div class="loader-spinner"></div>
            <h2 class="holo-text-small" style="color: #00548B;">INNOVA SCHOOLS SYSTEM</h2>
            <p>Iniciando Archipiélago Tecnológico...</p>
        </div>
    </div>

    <div id="notification-container"></div>
    <div class="matrix-bg"></div>
    <div id="canvas-container"></div>
    
    <div id="ui-layer">
        <header>
            <div class="header-main">
                <h1 class="holo-text">INNOVA <span style="color: #EF7D00;">ARCHIPELAGO</span></h1>
                <div class="group-selector-container">
                    <label>GRUPO:</label>
                    <select id="group-select">
                        <option value="2A">GRUPO 2A</option>
                        <option value="2B">GRUPO 2B</option>
                        <option value="2C">GRUPO 2C</option>
                        <option value="2D">GRUPO 2D</option>
                        <option value="3A">GRUPO 3A</option>
                        <option value="3B">GRUPO 3B</option>
                    </select>
                </div>
            </div>
            <div class="cloud-status" id="cloud-status">☁️ MODO LECTURA</div>
        </header>

        <aside id="leaderboard">
            <div class="side-header">
                <h2>RANKING <span id="current-group-label" style="color: #EF7D00;">2A</span></h2>
                <button id="toggle-rank">◀</button>
            </div>
            <div id="rank-list" class="scroll-box"></div>
        </aside>

        <div id="controls">
            <button class="btn-holo" id="btn-login-open">🔑 ACCESO DOCENTE</button>
            <button class="btn-holo solo-admin" id="btn-add-student">➕ NUEVO ALUMNO</button>
            <button class="btn-holo" id="btn-rotate">🔄 ROTACIÓN</button>
        </div>
        
        <div id="login-modal" class="glass-panel hidden">
            <div class="modal-content">
                <h2 class="holo-text-small" style="color: #EF7D00;">ACCESO SEGURO</h2>
                <input type="text" id="login-user" placeholder="USUARIO" class="holo-input">
                <input type="password" id="login-pass" placeholder="CONTRASEÑA" class="holo-input">
                <div class="edit-actions">
                    <button class="btn-holo btn-save" id="btn-login-submit">DESBLOQUEAR</button>
                    <button class="btn-holo" id="btn-login-close">CANCELAR</button>
                </div>
            </div>
        </div>

        <div id="student-modal" class="glass-panel hidden">
            <div class="modal-content">
                <div id="view-mode">
                    <h2 id="modal-name" class="holo-text-small">NOMBRE</h2>
                    <h3 id="modal-level">Nivel</h3>
                    <p>Energía: <span id="modal-stars">0</span> ★</p>
                    <button class="btn-edit solo-admin" id="btn-edit-profile">⚙️ GESTIONAR</button>
                </div>
                
                <div id="edit-mode" class="hidden">
                    <input type="text" id="edit-name-input" class="holo-input">
                    <div class="edit-actions">
                        <button class="btn-holo btn-save" id="btn-save-edit">GUARDAR</button>
                        <button class="btn-holo btn-delete" id="btn-delete-student">ELIMINAR</button>
                        <button class="btn-holo" id="btn-cancel-edit">X</button>
                    </div>
                </div>

                <div class="modal-actions solo-admin">
                    <div class="energy-buttons">
                        <button class="btn-holo btn-inv" id="reward-inn">💡 INN</button>
                        <button class="btn-holo btn-col" id="reward-col">🤝 COL</button>
                        <button class="btn-holo btn-cre" id="reward-cre">🎨 CRE</button>
                    </div>
                </div>

                <div class="medals-showcase">
                    <div id="modal-medals" class="medals-grid"></div>
                </div>
                <button class="btn-holo btn-close" id="btn-close-modal">CERRAR [X]</button>
            </div>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
